name: CI

# The steps below are the project gate in .tp/config.json, command for command.
# `tp done` runs that gate before it will close a task, so work that arrives
# through the loop passes all of it; this workflow is what a direct push or a
# pull request passes. When the two drift the weaker one becomes the real gate
# for everything outside tp, and the drift is invisible because both stay green.
# TestCIRunsEveryStepOfTheProjectGate fails when a gate step is missing here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # check-suite-state.sh RUNS `go test -race ./...` between two hashes of
      # spec/.tp-review/ and .tp/rounds/ (v0.36.0 §6.1 S1). It wraps the suite
      # rather than running beside it: hashing before and after ONE run is what
      # attributes a change to the suite, and a second run would double CI's
      # slowest step for nothing.
      - name: Test (and prove the suite mutated no review state)
        run: ./scripts/check-suite-state.sh

      # Every tool below is pinned to the exact version the gate is measured at
      # locally. A floating @latest makes the result a function of the day the
      # run happened rather than of the code it ran on: the same tree can pass
      # and then fail with no commit in between, and a tool that gains a check
      # breaks CI for reasons the diff cannot explain.
      #
      # It cuts the other way too. golangci-lint v2.12.2's staticcheck panics
      # building IR for Go 1.27's stdlib, reporting `package "poll"` — a package
      # this repository does not contain — so a downgrade past v2.13.0 would
      # look like a defect in tp. TestWorkflowToolsArePinned fails on any ref
      # here that is not an exact vN.N.N.

      - name: Install and run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run

      - name: Install and run deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.48.0
          ./scripts/check-deadcode.sh

      - name: Install and run the complexity ratchet
        run: |
          go install github.com/uudashr/gocognit/cmd/gocognit@v1.2.1
          ./scripts/check-complexity.sh
