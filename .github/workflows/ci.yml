name: CI

# The steps below are the project gate in .tp/config.json, command for command.
# `tp done` runs that gate before it will close a task, so work that arrives
# through the loop passes all of it; this workflow is what a direct push or a
# pull request passes. When the two drift the weaker one becomes the real gate
# for everything outside tp, and the drift is invisible because both stay green.
# TestCIRunsEveryStepOfTheProjectGate fails when a gate step is missing here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: go test -race ./...

      - name: Install and run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run

      - name: Install and run deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          ./scripts/check-deadcode.sh

      - name: Install and run the complexity ratchet
        run: |
          go install github.com/uudashr/gocognit/cmd/gocognit@latest
          ./scripts/check-complexity.sh
