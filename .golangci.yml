version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
    - unconvert
    - unparam
    - dupl

  settings:
    # funlen is deliberately NOT in `enable` above: scripts/check-complexity.sh
    # runs it on its own (--default=none --enable=funlen) against a committed
    # baseline, because 71 production functions are over these thresholds today.
    # The numbers are pinned here rather than left to golangci-lint's defaults
    # so that a change to those defaults cannot silently invalidate that
    # baseline — the gocognit half of the same script pins its threshold too.
    funlen:
      lines: 60
      statements: 40
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    errcheck:
      disable-default-exclusions: false
      exclude-functions:
        - (*os.File).Close
        - os.RemoveAll
        - (*github.com/fatih/color.Color).Fprintf
        - (*github.com/fatih/color.Color).Fprintln

formatters:
  enable:
    - gofmt

run:
  timeout: 5m

issues:
  # No truncation. The gate requires 0 issues, so a cap can never let a run
  # pass that would otherwise fail — it can only hide work from the person
  # fixing it: with the old 50/3, introducing 60 issues showed 50, and fixing
  # those 50 looked like finishing. Both were measured as inert today (0 issues
  # either way) and removed as a latent trap rather than a live one.
  max-issues-per-linter: 0
  max-same-issues: 0
  # One issue per line is golangci-lint's default and it silently drops the
  # second linter to report on the same line. gocognit and funlen both report on
  # the function declaration line, so running them together loses every funlen
  # issue on a function gocognit already flagged. Neither is enabled in this
  # file (scripts/check-complexity.sh runs them), so this is defence for any
  # future pair that shares a line.
  #
  # The counts that used to sit here went stale within one release. Their
  # replacement — "run funlen with and without a second line-sharing linter and
  # diff the counts" — was WORSE, and audit round 5 caught it by running it:
  # the delta is 0 at gocognit's default min-complexity, so a reader following
  # the instruction concludes this setting is unnecessary and deletes it. The
  # collision only appears at the threshold the ratchet actually uses,
  # TP_COGNIT_THRESHOLD (22), which lives in scripts/check-complexity.sh and not
  # here: at 22 it is 42 against 90, 48 funlen issues swallowed.
  #
  # A wrong number is falsifiable and was caught in one round. An
  # under-specified recipe appears to confirm the opposite of what it defends,
  # and nothing catches that.
  uniq-by-line: false
